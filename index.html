<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>WebDark</title>
    <style>
        body { background:#0d1117; color:#c9d1d9; font-family:Tahoma; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .box { background:#161b22; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:400px; }
        input { width:100%; padding:12px; margin:8px 0; background:#0d1117; border:1px solid #30363d; border-radius:12px; color:#c9d1d9; text-align:center; font-size:15px; }
        button { width:100%; padding:14px; background:#3fb950; color:white; border:none; border-radius:12px; font-size:15px; cursor:pointer; margin-top:12px; }
        .msg { margin-top:12px; font-size:12px; }
    </style>
</head>
<body>
<div class="box">
    <h2>WebDark</h2>
    <input id="u" placeholder="نام کاربری">
    <input id="p" type="password" placeholder="رمز عبور">
    <button onclick="go()">ورود</button>
    <div class="msg" id="m"></div>
</div>
<script>
async function go(){
    const u=document.getElementById('u').value.trim();
    const p=document.getElementById('p').value.trim();
    const m=document.getElementById('m');
    if(!u||!p){m.innerText='پر کن';return;}
    m.innerText='در حال بررسی...';
    try{
        const r=await fetch('https://botapi.rubika.ir/v3/BFEBBH0AVFKZLCQBJAUKVRCTHYAWIQAVXBPKDQPTWNTJRBOJGYDIFACHOYTQVZEQ/getUpdates',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:'{"limit":200}'
        });
        const d=await r.json();
        const ups=d?.data?.updates||[];
        let ok=false,n='';
        for(const x of ups){
            if(x.type!=='NewMessage')continue;
            const t=x.new_message?.text||'';
            if(!t)continue;
            const o={};
            t.split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.substring(0,i).trim()]=l.substring(i+1).trim();});
            if(o.username===u&&o.password===p){ok=true;n=o.name||'کاربر';break;}
        }
        if(ok){
            m.innerText='✅ خوش آمدید '+n;
            localStorage.setItem('userName',n);
        }else{
            m.innerText='❌ کاربری یافت نشد';
        }
    }catch(e){
        m.innerText='❌ خطا — نیاز به VPN';
    }
}
</script>
</body>
</html>
