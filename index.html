<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDark - ورود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma;
            background: #0d1117; color: #c9d1d9;
            min-height: 100vh; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: #161b22; border-radius: 20px; padding: 30px;
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid #30363d;
        }
        .logo {
            width: 90px; height: 90px; background: #3fb950;
            border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: white; margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 14px; background: #0d1117;
            border: 1px solid #30363d; border-radius: 12px; color: #c9d1d9;
            font-size: 15px; text-align: center; margin-bottom: 12px; outline: none;
        }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            color: white; background: #3fb950;
        }
        .status { margin-top: 12px; font-size: 12px; min-height: 20px; }
        .status.error { color: #f85149; }
        .status.success { color: #3fb950; }
        .status.info { color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">WD</div>
        <h2>WebDark</h2>
        <p style="color:#8b949e;margin-bottom:24px;font-size:13px;">ورود به سامانه آزمون</p>
        <input type="text" id="username" placeholder="نام کاربری" autocomplete="off">
        <input type="password" id="password" placeholder="رمز عبور" autocomplete="off">
        <button onclick="login()">ورود به حساب</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const status = document.getElementById('status');

            if (!username || !password) {
                status.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
                status.className = 'status error';
                return;
            }

            status.textContent = 'در حال بررسی...';
            status.className = 'status info';

            try {
                // ====== مستقیم به روبیکا (بدون پروکسی) ======
                const resp = await fetch('https://botapi.rubika.ir/v3/BFEBBH0AVFKZLCQBJAUKVRCTHYAWIQAVXBPKDQPTWNTJRBOJGYDIFACHOYTQVZEQ/getUpdates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ limit: 200 })
                });

                const data = await resp.json();
                const updates = data?.data?.updates || [];
                
                let found = false;
                let userName = 'کاربر';

                for (const upd of updates) {
                    if (upd.type !== 'NewMessage') continue;
                    const text = upd.new_message?.text || '';
                    if (!text) continue;

                    const parsed = {};
                    for (const line of text.split('\n')) {
                        const idx = line.indexOf(':');
                        if (idx > 0 && idx < line.length - 1) {
                            parsed[line.substring(0, idx).trim()] = line.substring(idx + 1).trim();
                        }
                    }

                    if (parsed.username === username && parsed.password === password) {
                        found = true;
                        userName = parsed.name || 'کاربر';
                        break;
                    }
                }

                if (found) {
                    status.textContent = `✅ خوش آمدید ${userName}!`;
                    status.className = 'status success';
                    localStorage.setItem('userName', userName);
                    setTimeout(() => location.href = 'exams.html', 1000);
                } else {
                    status.textContent = '❌ کاربری یافت نشد';
                    status.className = 'status error';
                }
            } catch (e) {
                status.textContent = '❌ خطا — با VPN تست کن';
                status.className = 'status error';
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
